
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Feliz San Valentín 💖</title>
<style>
body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffafbd, #ffc3a0);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.card {
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
h1 {
    color: #c9184a;
}
p {
    font-size: 18px;
    line-height: 1.6;
    color: #333;
}
.signature {
    margin-top: 30px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="card">
    <h1>¡Feliz San Valentín! 💘</h1>
    <p>
    Como no puedo decirte todo lo que te amo en este día, 
    pasaré el resto de mis días demostrándolo con hechos.
    </p>
    <p>
    En este presente y en todos los futuros posibles, 
    siempre te elegiría a ti.
    </p>
    <div class="signature">
        Con amor ❤️<br>
        Leonardo
    </div>
</div>
</body>
</html>
